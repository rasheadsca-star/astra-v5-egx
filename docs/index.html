    <tr><td>اختيار عشوائي (${R.runs} محاولة)</td><td>${f(R.return_mean)}% (${f(R.return_p10)} إلى ${f(R.return_p90)})</td><td class="neg">${f(R.dd_mean)}%</td><td>—</td><td>—</td><td>—</td></tr></table>
    <div class="mut" style="margin-top:6px">تتفوق على الاختيار العشوائي بنفس القواعد في <b>${R.strategy_beats_pct}%</b> من المحاولات${S.total_return_pct<M.total_return_pct?'، لكنها <b style="color:var(--warn)">أقل من شراء السوق كله</b> في هذه الفترة (سوق صاعد قوي، والمؤشر المتساوي الوزن متفائل لأنه يشمل الأسهم الصغيرة بلا تكلفة)':''}. حد ${P.params.max_pos} مراكز، مخاطرة ${P.params.risk_pct}% للصفقة، سقف ${P.params.pos_cap_pct}% للمركز و${P.params.adv_cap_pct}% من سيولة السهم اليومية.</div></div>`}
  if(F){h+=`<h2>المتابعة الحية (Forward Test)</h2><div class="c">`+(F.sessions_valid?`<div class="g"><div>جلسات مسجلة بصدق<b>${F.sessions_valid}</b></div><div>صفقات مغلقة<b>${F.closed}</b></div><div>قيد التنفيذ/الانتظار<b>${F.open+F.pending}</b></div><div>Top${F.top_n} متوسط صافٍ<b class="${cls(F.top.avg)}">${F.top.n?f(F.top.avg,2)+'%':'—'}</b></div><div>كل الأسهم متوسط<b>${F.all.n?f(F.all.avg,2)+'%':'—'}</b></div></div>`:`<div class="mut">لم يبدأ بعد: تُسجَّل التوصيات تلقائياً عند أول تحديث ببيانات حديثة <b>قبل افتتاح يوم الدخول</b>، ولا تُعدَّل بعدها. هذا الدليل الوحيد بلا انحياز، ويحتاج 2–3 أشهر. (${F.record_status==='skipped_stale'?'آخر محاولة تخطّت التسجيل لأن البيانات متأخرة':F.record_status})</div>`)+`</div>`}
  const PL=d.plan;
  if(PL){const T=PL.top,B=PL.base,R=PL.recent45;h+=`<h2>خطة الإدارة: احتمال بلوغ الأهداف (خارج العينة)</h2><div class="c"><div class="g">
  <div>بلوغ الهدف 1<b class="pos">${f(T.hit1)}%</b></div><div>بلوغ الهدف 2<b>${f(T.hit2)}%</b></div><div>لم يبلغ الهدف 1<b class="neg">${f(T.no_t1)}%</b></div><div>متوسط صافٍ للصفقة<b class="${cls(T.avg)}">${f(T.avg,2)}%</b></div><div>Profit Factor<b>${f(T.pf,2)}</b></div><div>صفقات Top5<b>${T.n}</b></div></div>
  <table style="margin-top:8px"><tr><th></th><th>الهدف 1</th><th>الهدف 2</th><th>متوسط صافٍ</th></tr>
  <tr><td>Top 5 (التوصيات)</td><td>${f(T.hit1)}%</td><td>${f(T.hit2)}%</td><td class="${cls(T.avg)}">${f(T.avg,2)}%</td></tr>
  <tr><td>كل الأسهم بنفس الخطة</td><td>${f(B.hit1)}%</td><td>${f(B.hit2)}%</td><td class="${cls(B.avg)}">${f(B.avg,2)}%</td></tr>
  <tr><td>آخر 45 يوماً (Top5 / الأساس)</td><td>${f(R.top.hit1)}% / ${f(R.base.hit1)}%</td><td>${f(R.top.hit2)}% / ${f(R.base.hit2)}%</td><td>${f(R.top.avg,2)}% / ${f(R.base.avg,2)}%</td></tr></table>
  <div class="mut" style="margin-top:6px"><b style="color:var(--warn)">اقرأ هذا بحذر:</b> الخطة نفسها (هدف قريب + نقل الوقف) هي سبب ارتفاع النسبة؛ <b>أي سهم</b> كان سيبلغ الهدف 1 بنسبة ${f(B.hit1)}% في هذه العينة الصاعدة. ما يضيفه الترتيب: +${f(T.hit1-B.hit1)} نقطة في بلوغ الهدف 1، وتفوق ${f(PL.excess_avg,2)}% للصفقة (نصف العينة الأول ${f(PL.excess_h1,2)}% / الثاني ${f(PL.excess_h2,2)}%). في سوق هابط ستنخفض هذه النسب للجميع. الاحتفاظ بالهدف 2 فقط يعطي عائداً أعلى للصفقة (راجع الجدول أدناه) لكن بنسبة إصابة أقل.</div></div>`}
  const L=d.liquidity;
  if(L){h+=`<h2>السيولة وحساسية الانزلاق</h2><div class="c"><div class="sc"><table><tr><th>شريحة السيولة</th><th>حصة Top5</th><th>عائد Top5</th><th>عائد كل الشريحة</th><th>التفوق</th></tr>`+['منخفضة','متوسطة','عالية'].map(k=>{const x=L.tiers[k];return `<tr><td>${k} ${k==='منخفضة'?'(&lt;'+L.cutoffs_m[0]+' م.ج)':k==='عالية'?'(≥'+L.cutoffs_m[1]+' م.ج)':''}</td><td>${f(x.top_share_pct,0)}%</td><td>${f(x.top_avg,2)}%</td><td>${f(x.base_avg,2)}%</td><td class="${cls(x.excess)}">${f(x.excess,2)}%</td></tr>`}).join('')+`</table></div>
  <div class="sc"><table><tr><th>سيناريو انزلاق إضافي (افتراض)</th><th>Top5</th><th>السوق</th><th>التفوق</th></tr>`+L.sensitivity.map(x=>`<tr><td style="text-align:right">${x.scenario}</td><td>${f(x.top_avg,2)}%</td><td>${f(x.base_avg,2)}%</td><td class="${cls(x.excess)}">${f(x.excess,2)}%</td></tr>`).join('')+`</table></div>
  <div class="mut">الميزة تظهر أوضح في الأسهم الأعلى سيولة، بينما معظم الاختيارات التاريخية من الشريحة الأقل سيولة حيث التنفيذ أصعب. سقف المركز = ${L.adv_cap_pct}% من متوسط التداول اليومي.</div></div>`}
  h+=`<h2>الدليل: نتائج خارج العينة بتنفيذ مطابق للشاشة</h2><div class="sc"><table><tr><th>الفئة</th><th>صفقات</th><th>إصابة الهدف</th><th>ربح صافٍ</th><th>متوسط صافٍ</th><th>Profit Factor</th></tr>`;
  for(const [n,s] of [['كل الأسهم (خط الأساس)',bl],['Top 10',b.top10],['Top 5',t5],['Top 3',t3]])h+=`<tr><td>${n}</td><td>${s.n}</td><td>${f(s.hit)}%</td><td>${f(s.win)}%</td><td class="${cls(s.avg)}">${f(s.avg,2)}%</td><td>${f(s.pf,2)}</td></tr>`;
  h+=`</table></div><h2>ثبات Top 5 شهرياً</h2><div class="sc"><table><tr><th>الشهر</th><th>صفقات</th><th>إصابة</th><th>ربح</th><th>متوسط</th></tr>`;
  for(const m of b.by_month_top5)h+=`<tr><td>${m.month}</td><td>${m.n}</td><td>${f(m.hit)}%</td><td>${f(m.win)}%</td><td class="${cls(m.avg)}">${f(m.avg,2)}%</td></tr>`;
  h+=`</table></div><h2>سلامة الاختبار</h2><div class="mut">قاعدة التنقية: ${I.purge_rule} · طيات نظيفة: ${I.all_folds_clean?'نعم':'لا'} (${I.folds}) · Placebo (${I.placebo?I.placebo.seeds:0} تباديل عشوائية) تفوق Top5 على السوق: ${I.placebo?I.placebo.excess_list.join('، ')+'% (متوسط '+I.placebo.excess_mean+'%)':'—'} · Brier ${I.brier} مقابل ثابت ${I.brier_constant} (الاحتمال الفردي لا يتفوق على رقم ثابت، لذلك لا يُعرض) · بصمة البيانات ${I.data_hash} · sklearn ${I.versions.sklearn} · ${I.versions.platform}</div>
  <details class="c"><summary>أسهم مستبعدة (${ex.length})</summary><div class="mut">${ex.map(([t,w])=>`<b>${t}</b>: ${w.join('، ')}`).join('<br>')}</div></details>
  <p class="mut">${b.method}. هدف ${b.params.target_atr}×ATR ووقف ${b.params.stop_atr}×ATR وتكلفة ${b.params.cost*100}%. قد يحمل الاختبار انحياز البقاء (أسهم مدرجة اليوم فقط) وعيّنته قصيرة. أداة دعم قرار وليست نصيحة استثمارية.</p>`;
  h+=`<p class="mut">مصدر العرض: ${src==='live'?'ملف البيانات الحي':'نسخة مضمّنة في الصفحة'} · وُلّد ${new Date(d.generated).toLocaleString('ar-EG')}</p>`;$('app').innerHTML=h;
}
main();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
