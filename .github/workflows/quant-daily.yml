name: ASTRA Quant Validation (read-only)

on:
  push:
    branches: [main]
    paths:
      - "quant/**"
      - "scripts/confluence-pullback-v1.js"
      - "scripts/confluence-validation.js"
      - "scripts/confluence-pullback-v2.js"
      - "scripts/confluence-v2-forward.js"
      - "scripts/confluence-v2-validation.js"
      - "scripts/build-engine-comparison.js"
      - "scripts/build-decision-cockpit.js"
      - "scripts/validate-decision-cockpit.js"
      - "config/execution-contract.json"
      - ".github/workflows/quant-daily.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-quant-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quant/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r quant/requirements.txt
      - name: Tests
        run: |
          npm test
          npm run quant:test
          npm run execution:validate
      - name: Build quant outputs in ephemeral workspace
        run: python quant/tools/astra_bridge.py
      - name: Guarded quant update in ephemeral workspace
        working-directory: quant
        run: python fetch/daily_update.py --no-yahoo
      - name: Publish payload in ephemeral workspace
        working-directory: quant
        run: python publish.py
      - name: Build static site in ephemeral workspace
        run: python quant/web/build.py
      - name: Build and validate Confluence V1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/confluence-pullback-v1.js
          node scripts/confluence-validation.js
      - name: Build and validate Confluence V2
        run: |
          node scripts/confluence-pullback-v2.js
          node scripts/confluence-v2-forward.js
          node scripts/confluence-v2-validation.js
      - name: Build comparison and cockpit for validation only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-engine-comparison.js
          npm run cockpit:build
          npm run cockpit:validate
          npm run ledger:verify
      - name: Prove workflow is read-only
        run: |
          echo "This workflow intentionally has contents: read and contains no commit/push step."
          git status --short | head -200
