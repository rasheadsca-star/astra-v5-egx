name: ASTRA Deployment Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-validation.yml']

permissions:
  actions: write
  contents: read

concurrency:
  group: astra-deployment-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch refresh, quant, and an unchanged-data repeat
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const repo = context.repo;
            async function dispatch(workflow_id) {
              const since = new Date(Date.now() - 1000).toISOString();
              await github.rest.actions.createWorkflowDispatch({...repo, workflow_id, ref: 'main'});
              for (let attempt = 0; attempt < 120; attempt++) {
                await sleep(10000);
                const {data} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id, event: 'workflow_dispatch', branch: 'main', created: `>=${since}`, per_page: 20});
                const run = data.workflow_runs.find(r => r.created_at >= since);
                if (!run || run.status !== 'completed') continue;
                core.info(`${workflow_id}: ${run.html_url} -> ${run.conclusion}`);
                await core.summary.addRaw(`\n- [${workflow_id} #${run.id}](${run.html_url}): ${run.conclusion}\n`).write();
                if (run.conclusion !== 'success') throw new Error(`${workflow_id} failed: ${run.html_url}`);
                return run;
              }
              throw new Error(`Timed out waiting for ${workflow_id}`);
            }
            await dispatch('daily-egx-data-refresh.yml');
            await dispatch('quant-daily.yml');
            const before = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data.commit.sha;
            await dispatch('quant-daily.yml');
            const after = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data.commit.sha;
            await core.summary.addRaw(`\nNo-change repeat: before=${before}, after=${after}\n`).write();
            if (before !== after) throw new Error('Repository changed during repeat: inspect commits for new input or an idempotency defect.');

      - name: Audit schedules and live Pages assets
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listRepoWorkflows({...context.repo, per_page: 100});
            for (const name of ['Daily EGX Data Refresh', 'ASTRA Quant Lane (daily)']) {
              const workflow = data.workflows.find(w => w.name === name);
              if (!workflow) throw new Error('Workflow missing: ' + name);
              if (workflow.state === 'disabled_manually' || workflow.state === 'disabled_inactivity') {
                await github.rest.actions.enableWorkflow({...context.repo, workflow_id: workflow.id});
              } else if (workflow.state !== 'active') throw new Error(name + ': ' + workflow.state);
              const {data: checked} = await github.rest.actions.getWorkflow({...context.repo, workflow_id: workflow.id});
              core.info(JSON.stringify({workflow: name, state: checked.state, path: checked.path}));
            }
            const base = 'https://rasheadsca-star.github.io/astra-v5-egx/';
            async function get(path) {
              const r = await fetch(base + path, {cache: 'no-store'});
              if (!r.ok) throw new Error(path + ': HTTP ' + r.status);
              return r;
            }
            const signals = await (await get('data/signals.json')).json();
            const status = await (await get('data/daily-data-update-status.json')).json();
            const manifest = await (await get('manifest.webmanifest')).json();
            const sw = await (await get('sw.js')).text();
            const html = await (await get('')).text();
            if (signals.session !== status.actualAcceptedSession) throw new Error('Accepted session mismatch');
            for (const key of ['scope', 'start_url']) {
              if (!new URL(manifest[key], base).pathname.startsWith('/astra-v5-egx/')) throw new Error('Manifest path escapes repository');
            }
            for (const icon of manifest.icons) await get(icon.src);
            if (!html.includes('name="viewport"') || !sw.includes('addEventListener')) throw new Error('PWA files missing');
            core.info(JSON.stringify({signalsSession: signals.session, expectedSession: status.expectedSession, status: status.finalStatus, manifestScope: manifest.scope, pwaAssets: 'reachable', mobileInstallation: 'not_verified'}));
