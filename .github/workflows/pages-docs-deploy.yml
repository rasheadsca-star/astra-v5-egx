name: Deploy Pages on docs changes

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages-docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astra-v5-pages-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify V5 page exists
        run: |
          test -f docs/v5/index.html
          grep -q "ASTRA V5" docs/v5/index.html
          test -f docs/data/engine-comparison.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy docs artifact
        id: deployment
        uses: actions/deploy-pages@v4
