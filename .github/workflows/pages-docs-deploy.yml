name: Deploy Pages on docs changes

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "app/dashboard/**"
      - "scripts/build-github-pages.js"
      - ".github/workflows/pages-docs-deploy.yml"
  workflow_run:
    workflows: ["Daily EGX Data Refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astra-v5-pages-docs
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build validated GitHub Pages snapshot
        run: node scripts/build-github-pages.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy docs artifact
        id: deployment
        uses: actions/deploy-pages@v4
