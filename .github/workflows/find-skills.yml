name: ASTRA V5 Skill Discovery

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Skill search query (example: github actions, testing, deployment)"
        required: true
        type: string
      owner:
        description: "Optional GitHub owner filter (example: vercel-labs)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  find-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ASTRA V5
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find skills
        shell: bash
        env:
          QUERY: ${{ inputs.query }}
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          echo "Searching skills for: $QUERY"
          if [ -n "$OWNER" ]; then
            npx -y skills@latest find "$QUERY" --owner "$OWNER"
          else
            npx -y skills@latest find "$QUERY"
          fi
