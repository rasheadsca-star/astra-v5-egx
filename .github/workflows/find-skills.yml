name: ASTRA V5 Skill Discovery

on:
  push:
    branches:
      - feat/find-skills-integration
    paths:
      - ".agents/skills/**"
      - ".github/workflows/find-skills.yml"
      - "package.json"
  workflow_dispatch:
    inputs:
      query:
        description: "Skill search query (example: github actions, testing, deployment)"
        required: true
        type: string
      owner:
        description: "Optional GitHub owner filter (example: vercel-labs)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  find-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ASTRA V5
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Verify installed find-skills skill
        run: |
          test -f .agents/skills/find-skills/SKILL.md
          grep -q '^name: find-skills$' .agents/skills/find-skills/SKILL.md
          echo "find-skills project skill is installed"

      - name: Find skills
        shell: bash
        env:
          INPUT_QUERY: ${{ inputs.query }}
          INPUT_OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          QUERY="${INPUT_QUERY:-github actions automation}"
          OWNER="${INPUT_OWNER:-}"
          echo "Searching skills for: $QUERY"
          if [ -n "$OWNER" ]; then
            npx -y skills@latest find "$QUERY" --owner "$OWNER"
          else
            npx -y skills@latest find "$QUERY"
          fi
