name: V6.11 Live Acceptance Setup Gate

on:
  push:
    branches:
      - v6.11-live-acceptance-monitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r quant/requirements.txt
      - name: Freeze and acceptance validations
        run: npm run acceptance:validate
      - name: Existing test suites
        run: |
          npm test
          npm run quant:test
      - name: Full build
        run: npm run build
      - name: Verify current acceptance state
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/live-acceptance.json','utf8'));
          if(!['WAITING_FOR_FIRST_SESSION','ONE_SESSION_ACCEPTED','ACCEPTANCE_COMPLETE'].includes(d.status))
            throw new Error('unexpected acceptance status '+d.status);
          if(d.automaticExecution!==false)throw new Error('acceptance enabled execution');
          const c=JSON.parse(fs.readFileSync('data/decision-cockpit.json','utf8'));
          if(c?.safety?.researchOnly!==true||c?.safety?.executionAllowed!==false||c?.safety?.automaticOrders!==false)
            throw new Error('execution safety changed');
          console.log({status:d.status,accepted:d.acceptedSessions,remaining:d.remainingSessions,execution:'OFF'});
          NODE
