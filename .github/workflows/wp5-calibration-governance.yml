name: WP5 Calibration Governance Gate

on:
  push:
    branches:
      - wp5-calibration-maturity
    paths:
      - 'scripts/lib/calibration-stats.js'
      - 'scripts/calibration-validation.js'
      - 'scripts/probability-calibration-engine.js'
      - 'scripts/capture-prospective-evidence.js'
      - 'scripts/lib/persistent-evidence.js'
      - 'scripts/walk-forward-validation.js'
      - 'scripts/outcome-analytics-engine.js'
      - 'scripts/model-governance-engine.js'
      - 'scripts/release-integrity-audit.js'
      - 'package.json'
      - 'app/dashboard/command-center.html'
      - 'app/dashboard/recommendations.html'
      - 'docs/CALIBRATION-GOVERNANCE.md'
      - '.github/workflows/daily-egx-data-refresh.yml'
      - '.github/workflows/wp5-calibration-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp5-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r quant/requirements.txt

      - name: Session-aware calibration unit gate
        run: npm run calibration:validate

      - name: Existing Node tests
        run: npm test

      - name: Existing Python quant tests
        run: npm run quant:test

      - name: Full build
        run: npm run build

      - name: Validate generated calibration contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/decision-cockpit.json','utf8'));
          const p=d.probabilityCalibrationEngine||{};
          const all=[...(d.topOpportunities||[]),...(d.watchlist||[]),...(d.rejected||[])];
          if(p.forwardResolved<90 || p.forwardDistinctSessions<30 || p.walkForwardCalibrationGate!==true){
            for(const x of all){
              if(x.targetAchievement?.t1ProbabilityPct!=null)throw new Error('T1 probability leaked before validation: '+x.ticker);
              if(x.targetAchievement?.t2ProbabilityPct!=null)throw new Error('T2 probability leaked before validation: '+x.ticker);
              if(x.targetAchievement?.stopProbabilityPct!=null)throw new Error('Stop probability leaked before validation: '+x.ticker);
            }
          }
          if(d?.safety?.executionAllowed!==false||d?.safety?.automaticOrders!==false)throw new Error('execution safety changed');
          console.log({
            status:p.status,
            resolved:p.forwardResolved,
            distinctSessions:p.forwardDistinctSessions,
            walkForwardGate:p.walkForwardCalibrationGate,
            scoring:p.calibrationScoring
          });
          NODE

      - name: Ten-cycle release audit
        run: npm run release:audit
