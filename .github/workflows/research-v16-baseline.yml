name: ASTRA V16 Baseline Evidence
on:
  push:
    branches: [research/v169-baseline]
    paths: ['.github/workflows/research-v16-baseline.yml', 'quant/research/v16_baseline.py', 'quant/web/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra-v16-baseline-research
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/research/v169-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r quant/requirements.txt
      - run: npm test && npm run quant:test
      - run: python quant/research/v16_baseline.py && python quant/web/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-baseline-evidence
          path: quant/data/v16-*.json
      - name: Commit research evidence and downloaded CSV only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quant/data/v16-*.json docs
          if ! git diff --cached --quiet; then
            git commit -m 'research: record prospective V16 comparison status'
            git push origin HEAD:research/v169-baseline
          fi
