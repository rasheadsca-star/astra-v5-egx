<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EGX NEXT — ترتيب الفرص</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e1116"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EGX NEXT">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6eb;--ok:#0a7d4f;--warn:#b26a00;--bad:#c0392b;--acc:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#8b95a5;--bd:#272d38;--ok:#3ecf8e;--warn:#f0a93b;--bad:#ff6b5e;--acc:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 12px 24px;line-height:1.6}
.w{max-width:980px;margin:auto}h1{font-size:20px;margin:16px 0 4px}h2{font-size:16px;margin:22px 0 8px}
.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}
.k{flex:1 1 130px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.k b{display:block;font-size:19px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.h{display:flex;justify-content:space-between;align-items:center;gap:8px}.t{font-size:17px;font-weight:700}
.tag{border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;border:1px solid}
.A{color:var(--ok)}.B{color:var(--warn)}.C{color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:8px;font-size:13px}.g div{background:var(--bg);border-radius:8px;padding:6px 8px}.g b{display:block;font-size:15px}
.bar{height:6px;background:var(--bd);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.al{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
</style></head><body><div class="w" id="app"></div>
<script>
const D=/*DATA*/null, ST=/*STATUS*/null;
const $=s=>document.getElementById(s),f=(x,n=1)=>(x==null?'—':Number(x).toFixed(n));
const cls=x=>x>0?'pos':x<0?'neg':'';
async function main(){
  let d=null,src='';
  try{const r=await fetch('data/signals.json',{cache:'no-store'});if(r.ok){d=await r.json();src='live'}}catch(e){}
  if(!d&&D){d=D;src='embedded'}
  if(!d){$('app').textContent='لا توجد بيانات — شغّل python update.py';return}
  let U=ST;try{const r=await fetch('data/daily-data-update-status.json',{cache:'no-store'});if(r.ok)U=await r.json()}catch(e){}
  const b=d.backtest,t3=b.top3,t5=b.top5,bl=b.baseline_all,I=d.integrity,ex=Object.entries(d.excluded||{});
  let h=`<h1>EGX NEXT V2.1 — ترتيب الفرص (دعم قرار)</h1><div class="mut">آخر جلسة في البيانات ${d.session} · المتوقعة ${U?.expectedSession||d.expected_session} · ${d.universe} سهماً مفحوصاً من ${d.symbols} مؤهلاً · ${d.history_sessions} جلسة</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a href="v5/" style="text-decoration:none;border:1px solid var(--bd);border-radius:8px;padding:7px 10px;color:var(--tx);background:var(--card)"><b>فتح ASTRA V5</b></a><a href="data/engine-comparison.json" style="text-decoration:none;border:1px solid var(--bd);border-radius:8px;padding:7px 10px;color:var(--tx);background:var(--card)">V2.1 / V4 / V5 مقارنة</a></div>`;
  {
   if(U){const c={SUCCESS:'var(--ok)',ALREADY_CURRENT:'var(--ok)',PARTIAL:'var(--warn)',WAITING_DATA:'var(--bad)',FAILED:'var(--bad)'}[U.finalStatus]||'var(--mut)';
    h+=`<div class="al" style="border-color:${c}"><b style="color:${c}">تحديث البيانات: ${U.finalStatus}</b> · جلسة معتمدة ${U.actualAcceptedSession||'—'} من المتوقعة ${U.expectedSession} · تغطية ${U.coveragePct}% (${U.acceptedRows} سهماً جديداً، ${U.staleRows} بلا بيانات الجلسة، ${U.quarantinedCount} صفاً في الحجر)${U.finalStatus==='WAITING_DATA'?' — المصدر لم يسلّم جلسة اليوم بعد؛ التوصيات أدناه من الجلسة السابقة ولا تُنفَّذ.':''}</div>`}}
  if(d.stale)h+=`<div class="al" style="border-color:var(--bad)">⛔ البيانات متأخرة ${d.stale_lag_sessions} جلسة عن المتوقعة (العطلات الرسمية غير محتسبة). لا تنفّذ أي توصية قبل تحديث البيانات ومطابقة السعر.</div>`;
  h+=`<div class="row" style="margin-top:10px"><div class="k"><span class="mut">حالة السوق</span><b>${d.regime}</b><span class="mut">اتساع ${d.breadth_pct}%</span></div>
  <div class="k"><span class="mut">تفوق Top5 على السوق</span><b class="${cls(I.top5_excess_mean_pct)}">${f(I.top5_excess_mean_pct,2)}%</b><span class="mut">فاصل 90%: ${I.top5_excess_ci90_block[0]} إلى ${I.top5_excess_ci90_block[1]}</span></div>
  <div class="k"><span class="mut">طيات موجبة</span><b>${I.folds_positive}</b><span class="mut">Walk-forward</span></div>
  <div class="k"><span class="mut">نسبة تحقق الدخول</span><b>${f(I.fill_rate_pct)}%</b><span class="mut">افتتاح ضمن ±1%</span></div></div>`;
  const ok=I.top5_excess_ci90_block[0]>0;
  h+=`<div class="al">${ok?'':'الميزة الإحصائية للنموذج <b>غير مثبتة بعد</b> (الفاصل يشمل الصفر) لذلك لا تُمنح أي درجة A. '}الفرص أدناه ترتيب نسبي للمراقبة وليست أوامر شراء. ${d.regime==='هابط'?'السوق هابط وعينة الاختبار في هذه الحالة صغيرة؛ خفّض الحجم. ':''}${d.drift_guard?'مفتاح الأداء الأخير مفعّل. ':''}</div><h2>الفرص (Top ${d.recommendations.length})</h2>`;
  for(const r of d.recommendations){const e=r.evidence;
    h+=`<div class="c"><div class="h"><span class="t">${r.rank}. ${r.ticker}</span><span class="tag ${r.tier}" style="border-color:currentColor">درجة ${r.tier}</span></div>
    <div class="mut">${r.setups.length?r.setups.join(' · '):'ترتيب إحصائي (بدون نمط فني واضح)'} · سيولة <b style="color:${r.liq_tier==='منخفضة'?'var(--warn)':'inherit'}">${r.liq_tier}</b> (${f(r.turnover_m)} م.ج/يوم · أقصى مركز عملي ${Math.round(r.max_position_egp/1000).toLocaleString('en')} ألف ج) · RSI ${r.rsi} · حجم ${f(r.vol_ratio)}× · 5ج ${f(r.r5)}% · 20ج ${f(r.r20)}%</div>
    <div class="g"><div>نطاق الدخول<b>${r.entry_zone[0]}–${r.entry_zone[1]}</b></div><div>وقف<b class="neg">${r.stop} (−${r.stop_pct}%)</b></div>
    <div>هدف 1<b class="pos">${r.target1} (+${r.target_pct}%)</b></div><div>هدف 2<b class="pos">${r.target2} (+${r.target2_pct}%)</b></div><div>عائد/مخاطرة<b>${r.rr1} ← ${r.rr}</b></div><div>حجم مقترح<b>${r.size_pct}%</b></div></div>
    <div class="mut" style="margin-top:6px">${r.entry_rule}.</div><div class="mut"><b>إدارة الصفقة:</b> ${r.manage}.</div>
    <div class="mut">دليل مجموعة الرتبة (${e.bucket}) للاحتفاظ بالهدف 2 فقط: إصابة ${f(e.hit)}% (حد أدنى 90%: ${f(r.group_hit_low90)}%) · متوسط صافٍ ${f(e.avg,2)}% · ${e.n} صفقة · في حالة السوق الحالية: ${e.regime_n} صفقة/${e.regime_days} يوماً</div>
    ${r.intraday?(r.intraday.status==='ok'?`<div class="mut" style="color:${r.intraday.open_in_zone?'var(--ok)':'var(--bad)'}">افتتاح ${r.intraday.open} ${r.intraday.open_in_zone?'داخل نطاق الدخول ✔':'خارج نطاق الدخول ✖ — لا تدخل'} · أول 15د: ${r.intraday.first15_ret_pct}% · حجم ${r.intraday.first15_vol_pct_of_avg_day}% من متوسط اليوم (تأكيد فقط، تجريبي)</div>`:`<div class="mut">أول 15 دقيقة: ${({not_entry_day:'ليست جلسة الدخول بعد',incomplete:'الشمعة الأولى لم تكتمل',unavailable:'غير متاح'})[r.intraday.status]||r.intraday.status}</div>`):''}
    ${r.notes.length?`<div class="mut" style="color:var(--warn)">• ${r.notes.join('<br>• ')}</div>`:''}</div>`}
  const P=d.portfolio,F=d.forward;
  if(P){const S=P.strategy,M=P.market_equal_weight,R=P.random_selection,C=P.curve;
    const mn=Math.min(...C.strategy,...C.market),mx=Math.max(...C.strategy,...C.market),W=640,Hh=170,X=i=>10+i*(W-20)/(C.dates.length-1),Y=v=>Hh-10-(v-mn)*(Hh-24)/(mx-mn||1);
    const line=(a,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2" points="${a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
    h+=`<h2>محاكاة محفظة (خارج العينة)</h2><div class="c"><div class="sc"><svg viewBox="0 0 ${W} ${Hh}" style="width:100%;min-width:320px;height:auto">${line(C.market,'var(--mut)')}${line(C.strategy,'var(--acc)')}</svg></div>
    <div class="mut">الأزرق: الاستراتيجية · الرمادي: متوسط السوق متساوي الوزن (${C.dates[0]} → ${C.dates[C.dates.length-1]})</div>
    <table><tr><th></th><th>عائد</th><th>أقصى تراجع</th><th>شارب</th><th>صفقات</th><th>تعرض</th></tr>
    <tr><td>خطة الهدفين (الافتراضية)</td><td class="${cls(S.total_return_pct)}">${f(S.total_return_pct)}%</td><td class="neg">${f(S.max_drawdown_pct)}%</td><td>${f(S.sharpe,2)}</td><td>${S.trades} (${f(S.win_pct,0)}% رابحة)</td><td>${f(S.avg_exposure_pct,0)}%</td></tr>
    ${d.portfolio_hold?`<tr><td>احتفاظ بالهدف 2 فقط (بلا خروج جزئي)</td><td class="${cls(d.portfolio_hold.strategy.total_return_pct)}">${f(d.portfolio_hold.strategy.total_return_pct)}%</td><td class="neg">${f(d.portfolio_hold.strategy.max_drawdown_pct)}%</td><td>${f(d.portfolio_hold.strategy.sharpe,2)}</td><td>${d.portfolio_hold.strategy.trades} (${f(d.portfolio_hold.strategy.win_pct,0)}% رابحة)</td><td>${f(d.portfolio_hold.strategy.avg_exposure_pct,0)}%</td></tr>`:''}<tr><td>متوسط السوق</td><td class="${cls(M.total_return_pct)}">${f(M.total_return_pct)}%</td><td class="neg">${f(M.max_drawdown_pct)}%</td><td>—</td><td>—</td><td>100%</td></tr>
    <tr><td>اختيار عشوائي (${R.runs} محاولة)</td><td>${f(R.return_mean)}% (${f(R.return_p10)} إلى ${f(R.return_p90)})</td><td class="neg">${f(R.dd_mean)}%</td><td>—</td><td>—</td><td>—</td></tr></table>
    <div class="mut" style="margin-top:6px">تتفوق على الاختيار العشوائي بنفس القواعد في <b>${R.strategy_beats_pct}%</b> من المحاولات${S.total_return_pct<M.total_return_pct?'، لكنها <b style="color:var(--warn)">أقل من شراء السوق كله</b> في هذه الفترة (سوق صاعد قوي، والمؤشر المتساوي الوزن متفائل لأنه يشمل الأسهم الصغيرة بلا تكلفة)':''}. حد ${P.params.max_pos} مراكز، مخاطرة ${P.params.risk_pct}% للصفقة، سقف ${P.params.pos_cap_pct}% للمركز و${P.params.adv_cap_pct}% من سيولة السهم اليومية.</div></div>`}
  if(F){h+=`<h2>المتابعة الحية (Forward Test)</h2><div class="c">`+(F.sessions_valid?`<div class="g"><div>جلسات مسجلة بصدق<b>${F.sessions_valid}</b></div><div>صفقات مغلقة<b>${F.closed}</b></div><div>قيد التنفيذ/الانتظار<b>${F.open+F.pending}</b></div><div>Top${F.top_n} متوسط صافٍ<b class="${cls(F.top.avg)}">${F.top.n?f(F.top.avg,2)+'%':'—'}</b></div><div>كل الأسهم متوسط<b>${F.all.n?f(F.all.avg,2)+'%':'—'}</b></div></div>`:`<div class="mut">لم يبدأ بعد: تُسجَّل التوصيات تلقائياً عند أول تحديث ببيانات حديثة <b>قبل افتتاح يوم الدخول</b>، ولا تُعدَّل بعدها. هذا الدليل الوحيد بلا انحياز، ويحتاج 2–3 أشهر. (${F.record_status==='skipped_stale'?'آخر محاولة تخطّت التسجيل لأن البيانات متأخرة':F.record_status})</div>`)+`</div>`}
  const PL=d.plan;
  if(PL){const T=PL.top,B=PL.base,R=PL.recent45;h+=`<h2>خطة الإدارة: احتمال بلوغ الأهداف (خارج العينة)</h2><div class="c"><div class="g">
  <div>بلوغ الهدف 1<b class="pos">${f(T.hit1)}%</b></div><div>بلوغ الهدف 2<b>${f(T.hit2)}%</b></div><div>لم يبلغ الهدف 1<b class="neg">${f(T.no_t1)}%</b></div><div>متوسط صافٍ للصفقة<b class="${cls(T.avg)}">${f(T.avg,2)}%</b></div><div>Profit Factor<b>${f(T.pf,2)}</b></div><div>صفقات Top5<b>${T.n}</b></div></div>
  <table style="margin-top:8px"><tr><th></th><th>الهدف 1</th><th>الهدف 2</th><th>متوسط صافٍ</th></tr>
  <tr><td>Top 5 (التوصيات)</td><td>${f(T.hit1)}%</td><td>${f(T.hit2)}%</td><td class="${cls(T.avg)}">${f(T.avg,2)}%</td></tr>
  <tr><td>كل الأسهم بنفس الخطة</td><td>${f(B.hit1)}%</td><td>${f(B.hit2)}%</td><td class="${cls(B.avg)}">${f(B.avg,2)}%</td></tr>
  <tr><td>آخر 45 يوماً (Top5 / الأساس)</td><td>${f(R.top.hit1)}% / ${f(R.base.hit1)}%</td><td>${f(R.top.hit2)}% / ${f(R.base.hit2)}%</td><td>${f(R.top.avg,2)}% / ${f(R.base.avg,2)}%</td></tr></table>
  <div class="mut" style="margin-top:6px"><b style="color:var(--warn)">اقرأ هذا بحذر:</b> الخطة نفسها (هدف قريب + نقل الوقف) هي سبب ارتفاع النسبة؛ <b>أي سهم</b> كان سيبلغ الهدف 1 بنسبة ${f(B.hit1)}% في هذه العينة الصاعدة. ما يضيفه الترتيب: +${f(T.hit1-B.hit1)} نقطة في بلوغ الهدف 1، وتفوق ${f(PL.excess_avg,2)}% للصفقة (نصف العينة الأول ${f(PL.excess_h1,2)}% / الثاني ${f(PL.excess_h2,2)}%). في سوق هابط ستنخفض هذه النسب للجميع. الاحتفاظ بالهدف 2 فقط يعطي عائداً أعلى للصفقة (راجع الجدول أدناه) لكن بنسبة إصابة أقل.</div></div>`}
  const L=d.liquidity;
  if(L){h+=`<h2>السيولة وحساسية الانزلاق</h2><div class="c"><div class="sc"><table><tr><th>شريحة السيولة</th><th>حصة Top5</th><th>عائد Top5</th><th>عائد كل الشريحة</th><th>التفوق</th></tr>`+['منخفضة','متوسطة','عالية'].map(k=>{const x=L.tiers[k];return `<tr><td>${k} ${k==='منخفضة'?'(&lt;'+L.cutoffs_m[0]+' م.ج)':k==='عالية'?'(≥'+L.cutoffs_m[1]+' م.ج)':''}</td><td>${f(x.top_share_pct,0)}%</td><td>${f(x.top_avg,2)}%</td><td>${f(x.base_avg,2)}%</td><td class="${cls(x.excess)}">${f(x.excess,2)}%</td></tr>`}).join('')+`</table></div>
  <div class="sc"><table><tr><th>سيناريو انزلاق إضافي (افتراض)</th><th>Top5</th><th>السوق</th><th>التفوق</th></tr>`+L.sensitivity.map(x=>`<tr><td style="text-align:right">${x.scenario}</td><td>${f(x.top_avg,2)}%</td><td>${f(x.base_avg,2)}%</td><td class="${cls(x.excess)}">${f(x.excess,2)}%</td></tr>`).join('')+`</table></div>
  <div class="mut">الميزة تظهر أوضح في الأسهم الأعلى سيولة، بينما معظم الاختيارات التاريخية من الشريحة الأقل سيولة حيث التنفيذ أصعب. سقف المركز = ${L.adv_cap_pct}% من متوسط التداول اليومي.</div></div>`}
  h+=`<h2>الدليل: نتائج خارج العينة بتنفيذ مطابق للشاشة</h2><div class="sc"><table><tr><th>الفئة</th><th>صفقات</th><th>إصابة الهدف</th><th>ربح صافٍ</th><th>متوسط صافٍ</th><th>Profit Factor</th></tr>`;
  for(const [n,s] of [['كل الأسهم (خط الأساس)',bl],['Top 10',b.top10],['Top 5',t5],['Top 3',t3]])h+=`<tr><td>${n}</td><td>${s.n}</td><td>${f(s.hit)}%</td><td>${f(s.win)}%</td><td class="${cls(s.avg)}">${f(s.avg,2)}%</td><td>${f(s.pf,2)}</td></tr>`;
  h+=`</table></div><h2>ثبات Top 5 شهرياً</h2><div class="sc"><table><tr><th>الشهر</th><th>صفقات</th><th>إصابة</th><th>ربح</th><th>متوسط</th></tr>`;
  for(const m of b.by_month_top5)h+=`<tr><td>${m.month}</td><td>${m.n}</td><td>${f(m.hit)}%</td><td>${f(m.win)}%</td><td class="${cls(m.avg)}">${f(m.avg,2)}%</td></tr>`;
  h+=`</table></div><h2>سلامة الاختبار</h2><div class="mut">قاعدة التنقية: ${I.purge_rule} · طيات نظيفة: ${I.all_folds_clean?'نعم':'لا'} (${I.folds}) · Placebo (${I.placebo?I.placebo.seeds:0} تباديل عشوائية) تفوق Top5 على السوق: ${I.placebo?I.placebo.excess_list.join('، ')+'% (متوسط '+I.placebo.excess_mean+'%)':'—'} · Brier ${I.brier} مقابل ثابت ${I.brier_constant} (الاحتمال الفردي لا يتفوق على رقم ثابت، لذلك لا يُعرض) · بصمة البيانات ${I.data_hash} · sklearn ${I.versions.sklearn} · ${I.versions.platform}</div>
  <details class="c"><summary>أسهم مستبعدة (${ex.length})</summary><div class="mut">${ex.map(([t,w])=>`<b>${t}</b>: ${w.join('، ')}`).join('<br>')}</div></details>
  <p class="mut">${b.method}. هدف ${b.params.target_atr}×ATR ووقف ${b.params.stop_atr}×ATR وتكلفة ${b.params.cost*100}%. قد يحمل الاختبار انحياز البقاء (أسهم مدرجة اليوم فقط) وعيّنته قصيرة. أداة دعم قرار وليست نصيحة استثمارية.</p>`;
  h+=`<p class="mut">مصدر العرض: ${src==='live'?'ملف البيانات الحي':'نسخة مضمّنة في الصفحة'} · وُلّد ${new Date(d.generated).toLocaleString('ar-EG')}</p>`;$('app').innerHTML=h;
}
main();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
